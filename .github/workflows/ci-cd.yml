name: CloudOps Autopilot CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-test-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/cloudops-autopilot:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/cloudops-autopilot:latest

  deploy:

    needs: build-test-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CloudOps-Autopilot
            ./deploy.sh
      - name: Verify deployment
        run: |
          sleep 10
          curl --fail http://${{ secrets.EC2_HOST }}:3000/health